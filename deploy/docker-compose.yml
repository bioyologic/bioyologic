# Bioyologic en un servidor con HTTPS automático (Caddy + Let's Encrypt).
#   cp .env.example .env    # y edita el dominio y la URL del código fuente
#   docker compose up -d --build
services:
  bioyologic:
    build: ..
    image: bioyologic:latest
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/data              # base de datos e imágenes (copia de seguridad: backup.sh)
    # Sin "ports": solo es accesible a través de Caddy.
    # El proceso corre sin privilegios (usuario normal, definido en el Dockerfile) y no puede ganarlos.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: &registros           # los registros no llenan el disco: 3 archivos de 10 MB como máximo
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2.8
    restart: unless-stopped
    depends_on: [bioyologic]
    ports:
      - "80:80"
      - "443:443"
    environment:
      BIOYOLOGIC_DOMAIN: ${BIOYOLOGIC_DOMAIN}
    logging: *registros
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data          # certificados HTTPS
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
